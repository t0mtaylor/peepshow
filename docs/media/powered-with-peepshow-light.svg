<svg xmlns="http://www.w3.org/2000/svg" width="208" height="32" role="img"
     aria-label="powered with peepshow">
  <title>powered with peepshow</title>
  <defs>
    <linearGradient id="ps" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <clipPath id="r"><rect width="208" height="32" rx="6"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="208" height="32" fill="#f4f4f8"/>
    <rect x="118" width="90" height="32" fill="url(#ps)"/>
    <rect width="208" height="32" fill="none" stroke="#dcdce4" stroke-width="1"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
     font-size="12" font-weight="600">
    <text x="12" y="21" fill="#3a3a46">powered with</text>
    <text x="130" y="21" fill="#17121f">peepshow</text>
  </g>
</svg>
